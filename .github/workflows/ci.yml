name: Balboa RAD Pool Controller CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  protocol-tests:
    name: Protocol tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test Balboa protocol layer
        run: dotnet test tests/BalboaSpa.Protocol.Tests/BalboaSpa.Protocol.Tests.csproj --configuration Release --verbosity normal
      - name: Validate RAD driver metadata
        shell: pwsh
        run: |
          $json = Get-Content src/BalboaSpa.RadDriver/BalboaPoolController.json -Raw | ConvertFrom-Json
          if ($json.CrestronSerialDeviceApi.GeneralInformation.DeviceType -ne 'Pool Controller') { throw 'Driver metadata is not Pool Controller.' }
          $comm = $json.CrestronSerialDeviceApi.Api.Communication
          if ($comm.Port -ne 4257) { throw 'Preferred/default BWA TCP port must be 4257.' }
          if (-not $comm.IsUserAdjustable) { throw 'TCP communication must be installer-adjustable.' }
          if ($comm.UserAdjustableProperties -notcontains 'EthernetAdjustablePort') { throw 'Installer-adjustable TCP port must include EthernetAdjustablePort.' }

  rad-build:
    name: RAD V1 SDK build and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Restore and build RAD driver with Crestron SDK 29
        shell: pwsh
        run: |
          msbuild .\src\BalboaSpa.RadDriver\BalboaSpa.RadDriver.csproj /restore /p:Configuration=Release /verbosity:minimal
      - name: Verify generated Crestron package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem .\src\BalboaSpa.RadDriver\bin -Recurse -Filter *.pkg -ErrorAction SilentlyContinue)
          if ($packages.Count -eq 0) {
            Get-ChildItem .\src\BalboaSpa.RadDriver\bin -Recurse | Select-Object FullName
            throw 'Crestron ManifestUtil did not generate a .pkg file.'
          }
          $packages | ForEach-Object { Write-Host "Package: $($_.FullName)" }
      - name: Upload RAD driver package and build output
        uses: actions/upload-artifact@v4
        with:
          name: balboa-rad-driver-build
          path: src/BalboaSpa.RadDriver/bin/Release/net47/**
          if-no-files-found: error
